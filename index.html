        <form class="form-inline m-3">
      
        <input 
            type="text" 
            class="form-control w-25 mr-2" 
            id="busqueda" 
            placeholder="Ingrese el producto buscado"
        >

        <button 
            type="button"

            id="btn_buscar">
            Buscar
        </button>

        <p class="bg-success w-25 p-2 m-4">Ingrese su producto</p>


    <form class="formulario m-4">
    <div class="form-group form_nombre">
        <label for="exampleInputEmail1">Nombre</label>
        <input type="text" class="form-control w-50" id="nombre" aria-describedby="emailHelp" placeholder="Ingrese el nombre">
   </div>
    <div class="form-group form_rubro w-50">
        <label for="rubro">Tamaño</label>
    <select class="form-control" id="tamano">
        <option selected>Seleccione el tamaño</option>
        <option value="1">S</option>
        <option value="2">M</option>
        <option value="2">L</option>
    </select>
    </div>
    <div class="form-group form_color">
        <label for="exampleInputPassword1">Color</label>
        <input type="text" class="form-control w-50" id="color" placeholder="Rojo-Azul..">
    </div>
    <div class="form-group form_precio">
        <label for="exampleInputPassword1">Precio</label>
        <input type="text" class="form-control w-50" id="precio" placeholder="$..">
    </div>

        <div class="form-group form_rubro w-50">
        <label for="rubro">Rubro</label>
        <select class="form-control" id="rubro">
        <option selected>Seleccione el rubro</option>
        <option value="Pantalones">Pantalones</option>
        <option value="Remeras">Remeras</option>
        </select>
    </div>
    <div class="form-group">
        <label for="img">Imagen</label>
        <input type="text" class="form-control w-50" id="img" placeholder="img/remera.webp">
    </div>

    <button type="button" class="btn btn-primary">Enviar</button>
    </form>

    <button class="btn btn-success m-3" id="btn_mostrar_productos">Mostrar Productos</button>
